version: 2
updates:
  # Go modules: one PR for routine minor/patch bumps, SemVer-majors stay separate.
  - package-ecosystem: "gomod"
    directories:
      - "/modules/core"
      - "/apps/cli"
      - "/modules/examples/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # testcontainers-go and its modules must bump together and break often
      # (0.x), so they never ride in go-deps.
      testcontainers:
        applies-to: version-updates
        patterns:
          - "github.com/testcontainers/testcontainers-go*"
      go-deps:
        applies-to: version-updates
        exclude-patterns:
          - "github.com/testcontainers/testcontainers-go*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
