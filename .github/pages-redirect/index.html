<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="redirect-destination" content="https://github.com/borg0ai/dx-issuegraph/tree/main/docs" />
    <meta http-equiv="refresh" content="1; url=https://github.com/borg0ai/dx-issuegraph/tree/main/docs/" />
    <title>IssueGraph documentation has moved</title>
  </head>
  <body>
    <p>
      The IssueGraph documentation has moved to
      <a id="destination" href="https://github.com/borg0ai/dx-issuegraph/tree/main/docs/">github.com/borg0ai/dx-issuegraph/tree/main/docs</a>.
    </p>
    <noscript>
      <p>
        JavaScript is required to preserve this page's path. Continue to the
        <a href="https://github.com/borg0ai/dx-issuegraph/tree/main/docs/">current IssueGraph documentation</a>.
      </p>
    </noscript>
    <script>
      (function () {
        var path = window.location.pathname;
        var destinationPath = path;

        if (path === "/issuegraph" || path === "/issuegraph/") {
          destinationPath = "/";
        } else if (path.indexOf("/issuegraph/") === 0) {
          destinationPath = path.slice("/issuegraph".length);
        }

        var destination =
          document.querySelector('meta[name="redirect-destination"]').content +
          destinationPath +
          window.location.search +
          window.location.hash;

        document.getElementById("destination").href = destination;
        window.location.replace(destination);
      })();
    </script>
  </body>
</html>
